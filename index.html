<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ทดสอบ PeriPage</title>
<style>
  :root{--bg:#f6f7f5;--ink:#1c2420;--mut:#66726b;--line:#d9dfdb;--acc:#0f7a5a;--card:#fff;--err:#b3261e}
  @media (prefers-color-scheme:dark){:root{--bg:#141815;--ink:#e8eee9;--mut:#93a09a;--line:#2b342f;--acc:#3fcf9f;--card:#1b211d;--err:#ff8a80}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans Thai","Sarabun",system-ui,sans-serif;padding:16px;max-width:560px;margin-inline:auto}
  h1{font-size:20px;margin:4px 0 12px}
  section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
  button{width:100%;padding:13px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:inherit;font-weight:600;margin-top:8px}
  button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
  button:disabled{opacity:.45}
  textarea{width:100%;min-height:220px;padding:10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font:13px/1.4 monospace}
  #st{font-size:14px;color:var(--mut)} #st.err{color:var(--err)}
  small{color:var(--mut)}
</style>
</head>
<body>
<h1>ทดสอบเครื่อง PeriPage A6</h1>

<section>
  <div id="st">ยังไม่ได้เชื่อมต่อ</div>
  <button id="bScan">1) ค้นหาและเชื่อมต่อ</button>
  <button id="bPrint" class="sec" disabled>2) ปริ้นทดสอบ (ทดลอง)</button>
  <small>เปิดด้วย Chrome บน Android · เปิดเครื่อง PeriPage ไว้ใกล้ๆ · ปิดแอป PeriPage ก่อน</small>
</section>

<section>
  <b>ผลที่ได้ (ส่งภาพหน้าจอส่วนนี้ให้ผม)</b>
  <textarea id="rep" readonly></textarea>
  <button id="bCopy" class="sec">คัดลอกผล</button>
</section>

<script>
const SERVICES = [
  '0000ff00-0000-1000-8000-00805f9b34fb','0000ffe0-0000-1000-8000-00805f9b34fb',
  '000018f0-0000-1000-8000-00805f9b34fb','49535343-fe7d-4ae5-8fa9-9fafd205e455',
  'e7810a71-73ae-499d-8c15-faa9aef0c3f2','0000fee7-0000-1000-8000-00805f9b34fb',
  '0000ae30-0000-1000-8000-00805f9b34fb','0000af30-0000-1000-8000-00805f9b34fb',
  '0000ff12-0000-1000-8000-00805f9b34fb','0000fff0-0000-1000-8000-00805f9b34fb',
  '00001800-0000-1000-8000-00805f9b34fb','0000180a-0000-1000-8000-00805f9b34fb'
];
const $ = id => document.getElementById(id);
let dev = null, ch = null;
const lines = [];
const sleep = ms => new Promise(r => setTimeout(r, ms));
function log(t){ lines.push(t); $('rep').value = lines.join('\n'); }
function st(t, err){ $('st').textContent = t; $('st').className = err ? 'err' : ''; }

$('bScan').onclick = async () => {
  lines.length = 0; ch = null; $('bPrint').disabled = true;
  if(!navigator.bluetooth){ st('เบราว์เซอร์นี้ไม่รองรับ Web Bluetooth', true); log('NO Web Bluetooth'); return; }
  try{
    dev = await navigator.bluetooth.requestDevice({
      filters: [{namePrefix:'PeriPage'},{namePrefix:'Peri'}],
      optionalServices: SERVICES
    });
    log('อุปกรณ์: ' + dev.name);
    st('กำลังเชื่อมต่อ...');
    const server = await dev.gatt.connect();
    const services = await server.getPrimaryServices();
    log('พบ service ' + services.length + ' ตัว');
    let best = null;
    for(const s of services){
      log('SERVICE ' + s.uuid);
      const cs = await s.getCharacteristics();
      for(const c of cs){
        const p = Object.keys(c.properties).filter(k => c.properties[k]).join(',');
        log('  CHAR ' + c.uuid + '  [' + p + ']');
        if(c.properties.writeWithoutResponse && !best) best = c;
        if(c.properties.write && !best) best = c;
      }
    }
    if(!services.length) log('ไม่พบ service ที่เข้าถึงได้ (อาจเป็น UUID ที่ไม่อยู่ในรายการ)');
    if(best){ ch = best; log('ช่องเขียนที่เลือก: ' + best.uuid); $('bPrint').disabled = false; st('เชื่อมต่อแล้ว: ' + dev.name); }
    else st('เชื่อมต่อได้ แต่ไม่พบช่องเขียนข้อมูล', true);
  }catch(e){
    log('ERROR: ' + e.name + ' — ' + e.message);
    st('ไม่สำเร็จ: ' + e.message, true);
  }
};

async function write(bytes){
  let chunk = ch.properties.writeWithoutResponse ? 100 : 20, i = 0;
  while(i < bytes.length){
    const part = bytes.slice(i, i + chunk);
    try{
      if(ch.properties.writeWithoutResponse) await ch.writeValueWithoutResponse(part);
      else await ch.writeValueWithResponse(part);
      i += part.length; await sleep(8);
    }catch(e){
      if(/in progress|busy/i.test(e.message)) { await sleep(20); continue; }
      if(chunk > 20){ chunk = 20; await sleep(100); continue; }
      throw e;
    }
  }
}

// ปริ้นทดสอบแบบ ESC/POS raster (GS v 0) กว้าง 384 จุด — เป็นการทดลอง ยังไม่ยืนยันว่ารุ่นนี้รับคำสั่งนี้
$('bPrint').onclick = async () => {
  try{
    const W = 384, H = 200, cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const g = cv.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0,0,W,H);
    g.strokeStyle = '#000'; g.lineWidth = 4; g.strokeRect(4,4,W-8,H-8);
    g.fillStyle = '#000'; g.textBaseline = 'top';
    g.font = 'bold 34px "Noto Sans Thai",sans-serif';
    g.fillText('ทดสอบ PeriPage', 20, 30);
    g.font = '28px "Noto Sans Thai",sans-serif';
    g.fillText('BN Shop 123456', 20, 90);
    g.fillText('ຂອບໃຈ ✓', 20, 135);
    const px = g.getImageData(0,0,W,H).data, wb = W/8, data = new Uint8Array(wb*H);
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){
      const i=(y*W+x)*4; if(0.3*px[i]+0.59*px[i+1]+0.11*px[i+2] < 150) data[y*wb+(x>>3)] |= (0x80 >> (x&7)); // 1 = ดำ
    }
    const head = [0x1b,0x40, 0x1d,0x76,0x30,0x00, wb&255, wb>>8, H&255, H>>8];
    const out = new Uint8Array(head.length + data.length + 4);
    out.set(head,0); out.set(data,head.length); out.set([0x0a,0x0a,0x0a,0x0a], head.length + data.length);
    st('กำลังส่ง ' + out.length + ' ไบต์...');
    const t0 = performance.now();
    await write(out);
    const s = ((performance.now()-t0)/1000).toFixed(1);
    log('ส่งทดสอบแล้ว ' + out.length + ' ไบต์ ใน ' + s + ' วิ — ดูว่าเครื่องปริ้นออกมาเป็นอะไร');
    st('ส่งแล้ว (' + s + ' วิ) ดูผลที่เครื่องปริ้น');
  }catch(e){ log('PRINT ERROR: ' + e.message); st('ปริ้นไม่สำเร็จ: ' + e.message, true); }
};

$('bCopy').onclick = async () => {
  try{ await navigator.clipboard.writeText($('rep').value); st('คัดลอกแล้ว'); }catch(e){ $('rep').select(); }
};
</script>
</body>
</html>
